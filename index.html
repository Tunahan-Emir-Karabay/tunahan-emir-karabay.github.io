}
* { box-sizing: border-box; }
body {

.wrap { max-width: 1060px; margin: 0 auto; }
a { color: var(--accent); text-underline-offset: 3px; }

h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); }

/* Üst şerit */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 18px; border-bottom: 1px solid var(--line); }

  .row { grid-template-columns: 1fr; gap: 4px; }

@media (prefers-reduced-motion: no-preference) { .lang button { transition: background .15s, color .15s; } }

    ],
    comp: [

    ],
    skills: [
      ["Control and autonomous systems", ["MPC", "Adaptive MPC", "Optimal control", "Reinforcement learning", "World Models", "Swarm formation", "Platoon control", "Route planning", "Path tracking", "SLAM", "Odometry and localization", "System identification"]],
      ["AI and perception", ["PyTorch", "CNN / ResNet", "Siamese networks", "Multi-task learning", "OpenCV", "YOLOv4 / v7", "Object tracking", "Kalman / EKF / UKF", "Particle filter"]],

};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tags = a => `<div class="tags">${a.map(t => `<span>${esc(t)}</span>`).join("")}</div>`;
const rows = list => list.map(([w, title, org, items]) =>
  `<div class="row"><div class="when">${esc(w)}</div><div><h3>${esc(title)} <em>· ${esc(org)}</em></h3><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div></div>`).join("");

function drawStep(t) {
  const svg = document.getElementById("step");
  const W = 420, H = 240, L = 40, R = 12, Tp = 14, B = 34;
  const z = 0.45, wn = 1, tMax = 16, yMax = 1.4;
  const wd = wn * Math.sqrt(1 - z * z), phi = Math.acos(z);
  const y = s => 1 - Math.exp(-z * wn * s) / Math.sqrt(1 - z * z) * Math.sin(wd * s + phi);
  const X = s => L + (s / tMax) * (W - L - R);
  const Y = v => Tp + (1 - v / yMax) * (H - Tp - B);
  let d = "";
  for (let i = 0; i <= 320; i++) { const s = tMax * i / 320; d += (i ? "L" : "M") + X(s).toFixed(1) + " " + Y(y(s)).toFixed(1); }
  const tp = Math.PI / wd, mp = y(tp), ts = 4 / (z * wn);
  const grid = [0, 4, 8, 12, 16].map(s => `<line x1="${X(s)}" y1="${Tp}" x2="${X(s)}" y2="${H - B}" stroke="var(--line)" stroke-width="1"/><text x="${X(s)}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${s}</text>`).join("")
    + [0, 0.5, 1].map(v => `<line x1="${L}" y1="${Y(v)}" x2="${W - R}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v.toFixed(1)}</text>`).join("");
  svg.innerHTML =
    `<rect x="${L}" y="${Y(1.02)}" width="${W - L - R}" height="${Y(0.98) - Y(1.02)}" fill="var(--band)"/>` + grid +
    `<line x1="${L}" y1="${Y(1)}" x2="${W - R}" y2="${Y(1)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>` +
    `<line x1="${X(ts)}" y1="${Tp}" x2="${X(ts)}" y2="${H - B}" stroke="var(--accent)" stroke-dasharray="2 4" stroke-width="1"/>` +
    `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>` +
    `<circle cx="${X(tp)}" cy="${Y(mp)}" r="4" fill="var(--accent)"/>` +
    `<text x="${X(tp) + 8}" y="${Y(mp) - 6}" font-size="11" fill="var(--fg)" font-family="IBM Plex Mono, monospace">Mp ${t === "tr" ? (Math.round((mp - 1) * 1000) / 10).toString().replace(".", ",") : (Math.round((mp - 1) * 1000) / 10)}%</text>` +
    `<text x="${X(ts) + 6}" y="${Tp + 12}" font-size="11" fill="var(--accent)" font-family="IBM Plex Mono, monospace">ts</text>` +
    `<text x="${W - R}" y="${H - 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${T[t].axT}</text>` +
    `<text x="${L}" y="${Tp - 2}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">y(t)</text>`;
}

function render(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t[el.dataset.i]; });
  document.getElementById("facts").innerHTML = t.facts.map(([b, s]) => `<div class="fact"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
  document.getElementById("projects").innerHTML = t.projects.map(p =>
    `<article class="proj"><span class="ctx">${esc(p.ctx)}</span><h3>${esc(p.h)}</h3><p>${esc(p.p)}</p>${p.r ? `<div class="result">${p.r}</div>` : ""}${tags(p.tags)}</article>`).join("");
  document.getElementById("exp").innerHTML = rows(t.exp);
  document.getElementById("comp").innerHTML = rows(t.comp);
  document.getElementById("edu").innerHTML = rows(t.edu);
  document.getElementById("skills").innerHTML = t.skills.map(([h, a]) => `<div><h3>${esc(h)}</h3>${tags(a)}</div>`).join("");
  document.getElementById("btn-tr").setAttribute("aria-pressed", lang === "tr");
  document.getElementById("btn-en").setAttribute("aria-pressed", lang === "en");
  drawStep(lang);
}

function pickLang() {
  const h = location.hash.replace("#", "");
  if (h === "tr" || h === "en") return h;
  try { const s = localStorage.getItem("lang"); if (s === "tr" || s === "en") return s; } catch (e) {}
  return (navigator.language || "").toLowerCase().startsWith("tr") ? "tr" : "en";
}
let cur = pickLang();
render(cur);
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  cur = b.dataset.lang; render(cur);
  try { localStorage.setItem("lang", cur); } catch (e) {}
  try { history.replaceState(null, "", "#" + cur); } catch (e) { location.hash = cur; }
}));
window.addEventListener("hashchange", () => { const h = location.hash.replace("#", ""); if ((h === "tr" || h === "en") && h !== cur) { cur = h; render(cur); } });
document.getElementById("copy").addEventListener("click", () => {
  const btn = document.getElementById("copy"), txt = document.getElementById("mail").textContent;
  const done = msg => { btn.textContent = msg; setTimeout(() => { btn.textContent = T[cur].copy; }, 1800); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("mail")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done(T[cur].copyfail); };
  try { navigator.clipboard.writeText(txt).then(() => done(T[cur].copied), fallback); } catch (e) { fallback(); }
});
</script>
