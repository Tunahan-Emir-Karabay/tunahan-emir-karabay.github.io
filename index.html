/* Layout: tek sütun okuma akışı; üstte isim + basamak yanıtı grafiği, altında projeler ızgarası, deneyim ve yarışma şeridi */
:root {

@media (prefers-color-scheme: dark) {

    --bg: #0d151b; --surface: #131e26; --fg: #e3ebef; --muted: #93a5b1; --line: #26343e;

  }
}
:root[data-theme="dark"] {

}
* { box-sizing: border-box; }
body {

}
.wrap { max-width: 1060px; margin: 0 auto; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); }

/* Üst şerit */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 18px; border-bottom: 1px solid var(--line); }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
.tags span { font: 400 .72rem var(--f-mono); border: 1px solid var(--line); color: var(--muted); border-radius: 4px; padding: 2px 7px; }

.rows { display: grid; }
.row { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 20px; padding-block: 16px; border-top: 1px solid var(--line); }
.row:last-child { border-bottom: 1px solid var(--line); }

.row ul { margin: 6px 0 0; padding-left: 18px; font-size: .93rem; }
.row li + li { margin-top: 3px; }

.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; }
.skills { display: grid; gap: 14px; }
.skills h3 { font: 600 .9rem var(--f-body); margin-bottom: 6px; }
.skills .tags span { font-size: .76rem; color: var(--fg); }
.pub { font-size: .93rem; border-left: 2px solid var(--accent); padding-left: 14px; }
footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); font: 400 .78rem var(--f-mono); color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

@media (max-width: 820px) {

  .projects, .two { grid-template-columns: 1fr; }
  .row { grid-template-columns: 1fr; gap: 4px; }
}
@media (prefers-reduced-motion: no-preference) { .lang button { transition: background .15s, color .15s; } }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tags = a => `<div class="tags">${a.map(t => `<span>${esc(t)}</span>`).join("")}</div>`;
const gallery = imgs => imgs && imgs.length ? `<div class="gallery">${imgs.map(([src, cap]) => `<figure><a href="img/${esc(src)}" target="_blank" rel="noopener"><img src="img/${esc(src)}" alt="${esc(cap)}"></a><figcaption>${esc(cap)}</figcaption></figure>`).join("")}</div>` : "";
const rows = list => list.map(([w, title, org, items, imgs]) =>
  `<div class="row"><div class="when">${esc(w)}</div><div><h3>${esc(title)} <em>· ${esc(org)}</em></h3><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>${gallery(imgs)}</div></div>`).join("");

function render(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t[el.dataset.i]; });
  document.getElementById("facts").innerHTML = t.facts.map(([b, s]) => `<div class="fact"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
  document.getElementById("projects").innerHTML = PROJECTS.map(p => {
    const d = p[lang];
    const docs = p.docs.length ? `<div class="docs">${p.docs.map(x => `<a href="docs/${esc(x.file)}" target="_blank" rel="noopener">${esc(x[lang])} ↗</a>`).join("")}</div>` : "";
    return `<article class="proj"><span class="ctx">${esc(d.ctx)}</span><h3>${esc(d.title)}</h3><ul>${d.b.map(i => `<li>${esc(i)}</li>`).join("")}</ul>${docs}${tags(p.tags)}</article>`;
  }).join("");
  document.getElementById("pubdocs").innerHTML = PUBDOCS.map(x => `<a href="docs/${esc(x.file)}" target="_blank" rel="noopener">${esc(x[lang])} ↗</a>`).join("");
  document.getElementById("exp").innerHTML = rows(t.exp);
  document.getElementById("comp").innerHTML = rows(t.comp);
  document.getElementById("edu").innerHTML = rows(t.edu);
  document.getElementById("skills").innerHTML = t.skills.map(([h, a]) => `<div><h3>${esc(h)}</h3>${tags(a)}</div>`).join("");
  document.getElementById("btn-tr").setAttribute("aria-pressed", lang === "tr");
  document.getElementById("btn-en").setAttribute("aria-pressed", lang === "en");
}

function pickLang() {
  const h = location.hash.replace("#", "");
  if (h === "tr" || h === "en") return h;
  try { const s = localStorage.getItem("lang"); if (s === "tr" || s === "en") return s; } catch (e) {}
  return (navigator.language || "").toLowerCase().startsWith("tr") ? "tr" : "en";
}
let cur = pickLang();
render(cur);
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  cur = b.dataset.lang; render(cur);
  try { localStorage.setItem("lang", cur); } catch (e) {}
  try { history.replaceState(null, "", "#" + cur); } catch (e) { location.hash = cur; }
}));
window.addEventListener("hashchange", () => { const h = location.hash.replace("#", ""); if ((h === "tr" || h === "en") && h !== cur) { cur = h; render(cur); } });
document.getElementById("copy").addEventListener("click", () => {
  const btn = document.getElementById("copy"), txt = document.getElementById("mail").textContent;
  const done = msg => { btn.textContent = msg; setTimeout(() => { btn.textContent = T[cur].copy; }, 1800); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("mail")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done(T[cur].copyfail); };
  try { navigator.clipboard.writeText(txt).then(() => done(T[cur].copied), fallback); } catch (e) { fallback(); }
});
